# The apply lane for text review and sign-off (repo #2, requirement
# jwildfire/obot.roadmap#115).
#
# The demo site is static and cannot authenticate, so a reviewer's approve /
# request-changes click is carried here as a `text-decision` repository_dispatch,
# sent straight from the browser to api.github.com with the reviewer's own
# fine-grained token (the pattern set by the roadmap audit page,
# jwildfire/obot.roadmap#109).
#
# The safety contract, in order:
#
#   1. GUARD. A repository_dispatch is authenticated as the token owner, so
#      `github.event.sender.login` IS the reviewer — no separate actor check to
#      get wrong. Only @jwildfire's decisions run.
#   2. NO SHELL INTERPOLATION OF PAYLOAD TEXT. The block id, the note and the
#      reviewer arrive as `env:` values and are read from the environment by the
#      apply script. A note is reviewer-authored prose; a note pasted into a
#      `run:` line would be a command-injection hole with a friendly UI on it.
#   3. THE GATES DECIDE. apply-text-decision.mjs re-runs the assembler and the
#      full gate set after the frontmatter edit and reverts the edit if anything
#      fails (exit 1). Nothing after it runs on failure, so nothing is committed.
#   4. CI, NOT JUST THE GATES. The R-independent half of CI — vitest, the two
#      freshness guards, the site build — runs before the commit, so a decision
#      can never land a tree that CI would reject on the next push.
#   5. THE COMMIT IS THE RECORD. One commit carrying the block, the reassembled
#      report, the regenerated evidence and the ledger entry: sign-off is an edit
#      to the source of truth, not an annotation beside it.
#
# workflow_dispatch takes the same four inputs and is the documented fallback:
# an expired browser token must never mean there is no way to approve a block.

name: text-decision

on:
  repository_dispatch:
    types: [text-decision]
  workflow_dispatch:
    inputs:
      decision:
        description: 'approve or changes'
        required: true
        type: choice
        options: [approve, changes]
      blockId:
        description: 'Text block id, e.g. TXT-E3-1222'
        required: true
        type: string
      note:
        description: 'Change-request note (required for "changes")'
        required: false
        type: string
      reviewer:
        description: 'GitHub login of the reviewer (defaults to the actor)'
        required: false
        type: string

# Decisions serialise: two approvals racing would both reassemble the report and
# one would push a tree built without the other's edit.
concurrency:
  group: text-decision
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  apply:
    name: Apply the decision
    if: >
      (github.event_name == 'repository_dispatch' && github.event.sender.login == 'jwildfire') ||
      (github.event_name == 'workflow_dispatch' && github.actor == 'jwildfire')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply the decision (re-runs the assembler and the gates)
        id: apply
        env:
          # Payload values NEVER reach a shell command line — see contract note 2.
          TEXT_DECISION: ${{ github.event.client_payload.decision || github.event.inputs.decision }}
          TEXT_BLOCK: ${{ github.event.client_payload.blockId || github.event.inputs.blockId }}
          TEXT_NOTE: ${{ github.event.client_payload.note || github.event.inputs.note }}
          TEXT_REVIEWER: ${{ github.event.client_payload.reviewer || github.event.inputs.reviewer || github.actor }}
          TEXT_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -o pipefail
          node scripts/apply-text-decision.mjs --report /tmp/text-decision.md | tee /tmp/apply.log

      # Everything below runs only when the decision landed: a failed or blocked
      # decision has already reverted its edit and exited non-zero.
      - name: Unit tests (JSON report reused by the evidence guard)
        run: |
          mkdir -p qc
          npx vitest run --reporter=default --reporter=json \
            --outputFile=qc/vitest-results.json

      - name: Requirement extracts are fresh
        run: node scripts/requirements.mjs --check

      - name: Regenerate the evidence sets
        # Approving a block turns its `text-review` evidence record from pending
        # to passed (contracts §10), so the committed evidence must move with the
        # approval or the next CI run fails the freshness guard.
        run: node scripts/evidence.mjs --no-run

      - name: Build the demo site
        run: node scripts/site.mjs

      - name: Commit the decision
        env:
          BLOCK: ${{ github.event.client_payload.blockId || github.event.inputs.blockId }}
          DECISION: ${{ github.event.client_payload.decision || github.event.inputs.decision }}
        run: |
          set -euo pipefail
          git add library/text site/text-decisions.json docs/assembled docs/evidence docs/requirements
          if git diff --cached --quiet; then
            echo "nothing to commit — the decision changed no tracked file" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # The message names the block and the decision, never the free-text note.
          git commit -m "Text decision: ${DECISION} ${BLOCK} (#2)" \
            -m "Applied by the text-decision lane for jwildfire/obot.roadmap#115. The assembler and the full gate set were re-run before this commit."
          git push origin HEAD:dev

      - name: Report
        if: always()
        run: |
          set -uo pipefail
          if [ -s /tmp/text-decision.md ]; then
            cat /tmp/text-decision.md >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Text decision failed"
              echo
              echo "The apply step produced no report. Run log:"
              echo
              echo '```'
              tail -30 /tmp/apply.log 2>/dev/null || echo "(no output captured)"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
