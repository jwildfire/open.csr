# open.csr CI (#1).
#
# Two independent jobs because open.csr is two stacks with one evidence stream:
#
#   node — the document/publishing half: vitest, the two freshness guards, and
#          the static site build (which fails on a broken internal link or any
#          external resource reference).
#   r    — the statistics half: the opencsr testthat suite, re-run from scratch
#          and compared against the committed qc/testthat-results.json so the R
#          evidence in the repo can never be stale.
#
# Suite-once discipline: the node job runs vitest exactly once, writes the JSON
# report to qc/vitest-results.json, and every later step reuses it (--no-run).

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Node — tests, guards, site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (JSON report reused by the evidence guard)
        run: |
          mkdir -p qc
          npx vitest run --reporter=default --reporter=json \
            --outputFile=qc/vitest-results.json

      - name: Requirement extracts are fresh
        run: node scripts/requirements.mjs --check

      - name: Evidence sets are fresh
        run: node scripts/evidence.mjs --check --no-run

      - name: Assemble every template object (enforces the D7 gates)
        # Re-assembles from library/ + outputs/ so the binding-resolution,
        # numeric-fidelity, cross-reference and approval gates run on every PR.
        # `--all` covers every template object in library/templates/, not only the
        # default clinical study report: a template that is never assembled in CI
        # is a directory, not a template, and would rot unnoticed (#28).
        # Non-zero exit if any gate fails in any document.
        run: node scripts/assemble.mjs --all

      - name: Build the demo site
        run: node scripts/site.mjs

      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/_build
          retention-days: 14

  r:
    name: R — opencsr testthat suite
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: pipeline
          extra-packages: |
            any::testthat
            any::jsonlite
            any::pkgload
            any::pharmaverseadam
            any::cardx
            any::r2rtf

      - name: Vendored CDISCPILOT01 data matches its provenance record
        # The eleven .xpt.gz under pipeline/inst/extdata/ are a third-party data
        # package. Their SHA-256 digests are recorded; a silent change to any of
        # them would change published figures, so it fails the build (#39).
        run: Rscript qc/vendor-phuse-data.R --check

      - name: Run the testthat suite
        run: Rscript qc/run-tests.R

      - name: The two packagings of CDISCPILOT01 diverge only where recorded
        # Second measurement of the facts TFL-SRC-001 asserts, by a route that
        # never loads {opencsr}. Non-zero when the sources move relative to each
        # other, or when the committed record stops describing them (#39).
        run: Rscript qc/source-agreement.R

      - name: The populations and end-of-study tables agree with the pilot's own report
        # Third measurement of every cell t-populations and t-end-of-study
        # publish, against the clinical study report the CDISC pilot published in
        # 2006 from SAS programs sharing no code with this repository. Compares a
        # from-scratch recomputation, the committed rendered HTML and the
        # transcribed report; any two disagreeing is non-zero (DSP-REF-001).
        #
        # The fidelity of the transcription itself is checked by
        # `--verify-transcription`, which is deliberately NOT run here: it needs
        # the network and pdftotext, and a build that fails because a third-party
        # download was slow teaches people to ignore the build. Run it by hand
        # whenever quality/data/reference-report-agreement.json is edited.
        run: Rscript qc/reference-report-agreement.R

      - name: The reference-report comparison can still fail
        # A green check nobody has seen fail is not evidence. Perturbs each of the
        # three routes in turn and requires the comparison to catch each one.
        run: Rscript qc/reference-report-agreement.R --self-test

      - name: The efficacy displays agree with an independent recomputation and with the reference report
        # Every figure in the nine efficacy displays, measured a second time by a
        # route that never loads {opencsr} and solves the ANCOVA by an explicit
        # QR rather than lm(), and a third time against the CDISC pilot's own
        # published Section 14 tables. Non-zero when any of the three moves, or
        # when the set of declared differences from the reference changes.
        run: Rscript qc/efficacy-agreement.R

      - name: Committed R results match this run
        # run-tests.R rewrites qc/testthat-results.json; anything but a
        # provenance-only difference means the committed evidence is stale.
        run: |
          node -e '
            const fs = require("node:fs");
            const { execSync } = require("node:child_process");
            const fresh = JSON.parse(fs.readFileSync("qc/testthat-results.json", "utf8"));
            const committed = JSON.parse(
              execSync("git show HEAD:qc/testthat-results.json", { encoding: "utf8" })
            );
            const key = (r) => `${r.file}|${r.test}|${r.status}`;
            const a = new Set((committed.records || []).map(key));
            const b = new Set((fresh.records || []).map(key));
            const diff = [
              ...[...a].filter((k) => !b.has(k)).map((k) => `only in the commit: ${k}`),
              ...[...b].filter((k) => !a.has(k)).map((k) => `only in this run:   ${k}`)
            ];
            if (diff.length) {
              console.error("qc/testthat-results.json is stale:");
              diff.forEach((d) => console.error("  - " + d));
              process.exit(1);
            }
            console.log(`OK — ${b.size} R test records match the commit.`);
          '

      # Route B of the vital signs / weight / concomitant-medication qualification:
      # every publishable statistic in those four committed ARDs, recomputed from
      # the raw pharmaverseadam datasets by code that shares nothing with the
      # pipeline, and compared both with the pipeline and with what the sponsor's
      # 2006 clinical study report printed. Exits non-zero on any disagreement.
      - name: Vital signs, weight and concomitant medications agree on three routes
        run: Rscript qc/vitals-conmeds-agreement.R

      - name: Committed agreement record matches this run
        run: |
          node -e '
            const fs = require("node:fs");
            const { execSync } = require("node:child_process");
            const path = "quality/data/vitals-conmeds-agreement.json";
            const fresh = JSON.parse(fs.readFileSync(path, "utf8"));
            const committed = JSON.parse(execSync(`git show HEAD:${path}`, { encoding: "utf8" }));
            const shape = (d) => JSON.stringify({
              ok: d.ok,
              comparisons: d.comparisons,
              displays: (d.displays || []).map((x) => [
                x.display, x.version, x.publishable_statistics, x.recomputed, x.unchecked
              ])
            });
            if (shape(fresh) !== shape(committed)) {
              console.error(path + " is stale:");
              console.error("  commit:   " + shape(committed));
              console.error("  this run: " + shape(fresh));
              process.exit(1);
            }
            console.log(`OK — ${fresh.comparisons} comparisons match the commit.`);
          '

      - name: Upload the R results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testthat-results
          path: qc/testthat-results.json
          retention-days: 14
