  - { analysis: sbp_lying_wk24, variable: AVAL, pattern: median, label: "Median", indent: 3 }
  - { analysis: sbp_lying_wk24, variable: AVAL, pattern: range, label: "Min, Max", indent: 3 }
  - { label: "End of treatment", section: true, indent: 2 }
