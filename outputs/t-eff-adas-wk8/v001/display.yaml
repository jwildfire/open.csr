id: t-eff-adas-wk8
title: "ADAS-Cog (11) - Change from Baseline to Week 8 - LOCF"
study: CDISCPILOT01
population_label: "Efficacy Analysis Set"
cutoff: "2015-02-17"
source: "Source: adqsadas (ADAS-Cog (11) total score, PARAMCD ACTOT) and adsl, from the CDISC pilot's own ADaM package (phuse-org/phuse-scripts, MIT). Analysis as specified in the CDISCPILOT01 statistical analysis plan, section 10.1.1. Reference report display: Table 14-3.03. Data cut-off: 2015-02-17."
footnotes:
  - "[1] Based on an analysis of covariance (ANCOVA) model with treatment and site group as factors and the baseline score as a covariate."
  - "[2] Test for a non-zero coefficient for treatment (dose) as a continuous variable."
  - "[3] Pairwise comparison with treatment as a categorical variable; p-values are not adjusted for multiple comparisons."
  - "Missing post-baseline values are imputed by last observation carried forward, over assessments assigned to visit windows (CDISCPILOT01 statistical analysis plan, sections 8.1 and 8.2)."
  - "Treatment columns are planned treatment (TRTP), which is how the CDISCPILOT01 reference report presents them."
  - "CDISCPILOT01 states no data cut-off date. The date shown is the latest ADAS-Cog assessment date present in the vendored ADaM package."
columns:
  order: ["Placebo", "Xanomeline Low Dose", "Xanomeline High Dose"]
format:
  mean_sd: "{mean} ({sd})"
  median_range: "{median} ({min};{max})"
  est_se: "{estimate} ({se})"
  ci: "({lcl};{ucl})"
  p_value: "{pvalue}"
  digits:
    mean: 1
    sd: 2
    median: 1
    min: 0
    max: 0
    estimate: 1
    se: 2
    lcl: 1
    ucl: 1
    pvalue: 3
rows:
  - { label: "Baseline", section: true }
  - { analysis: summary, variable: BASE, pattern: "N", label: "n", indent: 1 }
  - { analysis: summary, variable: BASE, pattern: mean_sd, label: "Mean (SD)", indent: 1 }
  - { analysis: summary, variable: BASE, pattern: median_range, label: "Median (Range)", indent: 1 }
  - { label: "Week 8", section: true }
  - { analysis: summary, variable: AVAL, pattern: "N", label: "n", indent: 1 }
  - { analysis: summary, variable: AVAL, pattern: mean_sd, label: "Mean (SD)", indent: 1 }
  - { analysis: summary, variable: AVAL, pattern: median_range, label: "Median (Range)", indent: 1 }
  - { label: "Change from baseline", section: true }
  - { analysis: summary, variable: CHG, pattern: "N", label: "n", indent: 1 }
  - { analysis: summary, variable: CHG, pattern: mean_sd, label: "Mean (SD)", indent: 1 }
  - { analysis: summary, variable: CHG, pattern: median_range, label: "Median (Range)", indent: 1 }
  - { label: "Statistical comparison of the change from baseline", section: true }
  - { analysis: ancova, variable: CHG, level: dose_response, pattern: p_value,
      label: "p-value (dose response) [1][2]", indent: 1 }
  - { analysis: ancova, variable: CHG, level: xan_vs_placebo, pattern: p_value,
      label: "p-value (Xanomeline - Placebo) [1][3]", indent: 1 }
  - { analysis: ancova, variable: CHG, level: xan_vs_placebo, pattern: est_se,
      label: "Difference of LS means (SE)", indent: 2 }
  - { analysis: ancova, variable: CHG, level: xan_vs_placebo, pattern: ci,
      label: "95% CI", indent: 2 }
  - { analysis: ancova, variable: CHG, level: high_vs_low, pattern: p_value,
      label: "p-value (Xanomeline High - Xanomeline Low) [1][3]", indent: 1 }
  - { analysis: ancova, variable: CHG, level: high_vs_low, pattern: est_se,
      label: "Difference of LS means (SE)", indent: 2 }
  - { analysis: ancova, variable: CHG, level: high_vs_low, pattern: ci,
      label: "95% CI", indent: 2 }
variants:
  post_text: {}
