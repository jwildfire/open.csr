id: t-sae-incidence
title: "Incidence of Treatment Emergent Serious Adverse Events by Treatment Group"
study: CDISCPILOT01
population_label: "Safety Analysis Set"
cutoff: "2014-07-01"
source: "Source: adae, adsl (CDISCPILOT01 ADaM package, phuse-org/phuse-scripts). Data cut-off: 2014-07-01."
footnotes:
  - "Serious treatment-emergent events are those flagged AESER = 'Y' and TRTEMFL = 'Y' in the study's ADAE, as the reference report (Table 14-5.02) counts them. Adverse events are coded using MedDRA."
  - "Subjects are counted once per system organ class and once per preferred term; percentages are based on the number of subjects in the safety population within each treatment group. The bracketed figure is the total number of times an event was recorded."
  - "P-values are Fisher's exact test comparing placebo with each active treatment group on the number of subjects with the event. An asterisk is appended to p-values below 0.15, as in the reference report; a p-value that rounds to 1 prints as >0.99; where neither arm has a subject with the event there is no test and the cell is blank."
  - "System organ classes are in alphabetical order; preferred terms within a class are in descending order of subjects across the three groups, then alphabetical — the order the reference report's serious-events program prints, which differs from its full incidence table."
columns:
  order: [Placebo, "Xanomeline Low Dose", "Xanomeline High Dose", "Placebo vs. Low Dose", "Placebo vs. High Dose"]
  patterns:
    "Placebo vs. Low Dose": pvalue
    "Placebo vs. High Dose": pvalue
format:
  n_pct_events: "{n} ({p}%) [{events}]"
  pvalue: "{p_value_fmt}"
  zero_count: "0"
  digits:
    p: 1
    events: 0
rows:
  - { analysis: any, label: "ANY BODY SYSTEM", pattern: n_pct_events, indent: 0 }
  - analysis: by_soc_pt
    type: hierarchical
    levels: [AEBODSYS, AEDECOD]
    pattern: n_pct_events
    sort:
      outer: alpha
variants:
  post_text: {}
  in_text:
    title: "Serious Adverse Events (Summary)"
