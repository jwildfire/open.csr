id: t-eff-npix-mean
title: "Mean NPI-X Total Score from Week 4 through Week 24 - Windowed"
study: CDISCPILOT01
population_label: "Efficacy Analysis Set"
cutoff: "2015-02-17"
source: "Source: adqsnpix (NPI-X (9) total score, PARAMCD NPTOT) and adsl, from the CDISC pilot's own ADaM package (phuse-org/phuse-scripts, MIT). Analysis as specified in the CDISCPILOT01 statistical analysis plan, section 10.2.1. Reference report display: Table 14-3.12. Data cut-off: 2015-02-17."
footnotes:
  - "[1] Based on an analysis of covariance (ANCOVA) model with treatment and site group as factors and the baseline score as a covariate."
  - "[2] Test for a non-zero coefficient for treatment (dose) as a continuous variable."
  - "[3] Pairwise comparison with treatment as a categorical variable; p-values are not adjusted for multiple comparisons."
  - "The Week 4 to Week 24 endpoint is the mean of a subject's available NPI-X (9) total scores over the Week 4 to Week 24 assessment windows, as the statistical analysis plan defines it in section 10.2.1. A subject contributes one value however many assessments it averages, and a subject with no assessment in that span contributes none, so n is smaller than the column N."
  - "DEFINED HERE, NOT INHERITED: this endpoint is derived from the per-visit NPTOT records rather than read from the study's own NPTOTMN parameter. The study's analysis results metadata (define.xml, Table_14-3.12) selects NPTOTMN; that parameter answers a narrower question than the analysis plan states and does not reproduce the reference report's own Table 14-3.12, which the derivation used here reproduces to every cell. The divergence is measured and recorded in quality/data/efficacy-agreement.json."
  - "Assessments are selected by AVISITN, not AVISIT: adqsnpix ships AVISIT right-aligned in a 16-character field, so a comparison against the visible label silently selects no records."
  - "Treatment columns are planned treatment (TRTP), which is how the CDISCPILOT01 reference report presents them."
  - "CDISCPILOT01 states no data cut-off date. The date shown is the latest assessment date present in the vendored ADaM package."
columns:
  order: ["Placebo", "Xanomeline Low Dose", "Xanomeline High Dose"]
format:
  mean_sd: "{mean} ({sd})"
  median_range: "{median} ({min};{max})"
  est_se: "{estimate} ({se})"
  ci: "({lcl};{ucl})"
  p_value: "{pvalue}"
  digits:
    mean: 1
    sd: 2
    median: 1
    min: 0
    max: 0
    estimate: 1
    se: 2
    lcl: 1
    ucl: 1
    pvalue: 3
rows:
  - { label: "Baseline", section: true }
  - { analysis: baseline, variable: AVAL, pattern: "N", label: "n", indent: 1 }
  - { analysis: baseline, variable: AVAL, pattern: mean_sd, label: "Mean (SD)", indent: 1 }
  - { analysis: baseline, variable: AVAL, pattern: median_range, label: "Median (Range)", indent: 1 }
  - { label: "Mean of Weeks 4-24", section: true }
  - { analysis: mean_4_24, variable: AVAL, pattern: "N", label: "n", indent: 1 }
  - { analysis: mean_4_24, variable: AVAL, pattern: mean_sd, label: "Mean (SD)", indent: 1 }
  - { analysis: mean_4_24, variable: AVAL, pattern: median_range, label: "Median (Range)", indent: 1 }
  - { label: "Statistical comparison of the mean over Weeks 4 to 24", section: true }
  - { analysis: ancova, variable: AVAL, level: dose_response, pattern: p_value,
      label: "p-value (dose response) [1][2]", indent: 1 }
  - { analysis: ancova, variable: AVAL, level: xan_vs_placebo, pattern: p_value,
      label: "p-value (Xanomeline - Placebo) [1][3]", indent: 1 }
  - { analysis: ancova, variable: AVAL, level: xan_vs_placebo, pattern: est_se,
      label: "Difference of LS means (SE)", indent: 2 }
  - { analysis: ancova, variable: AVAL, level: xan_vs_placebo, pattern: ci,
      label: "95% CI", indent: 2 }
  - { analysis: ancova, variable: AVAL, level: high_vs_low, pattern: p_value,
      label: "p-value (Xanomeline High - Xanomeline Low) [1][3]", indent: 1 }
  - { analysis: ancova, variable: AVAL, level: high_vs_low, pattern: est_se,
      label: "Difference of LS means (SE)", indent: 2 }
  - { analysis: ancova, variable: AVAL, level: high_vs_low, pattern: ci,
      label: "95% CI", indent: 2 }
variants:
  post_text: {}
