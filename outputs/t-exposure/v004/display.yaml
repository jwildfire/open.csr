id: t-exposure
title: "Summary of Planned Exposure to Study Drug, as of End of Study"
study: CDISCPILOT01
population_label: "Safety Analysis Set"
cutoff: "2014-07-01"
source: "Source: adsl (CDISCPILOT01 ADaM package, phuse-org/phuse-scripts). Data cut-off: 2014-07-01."
footnotes:
  - "Average daily dose and cumulative dose are the subject-level AVGDD and CUMDOSE the study's own ADaM package carries; no exposure (ADEX) dataset is used. End of study is Week 26 or early termination."
  - "The reference report (Table 14-4.01) presents completers at Week 24 and the safety population as two column groups. This display presents the same statistics with the two populations as row blocks under one set of treatment columns; no number differs."
  - "Completers at Week 24 are the subjects flagged COMP24FL = 'Y' in the safety analysis set: 60, 28 and 30 subjects."
  - "Duration of treatment (ADSL TRTDUR, days from first to last dose inclusive) and the cumulative exposure categories over it are not part of the reference table; they are carried here because the narrative in Section 12.1 quotes them. A subject treated for 200 days is counted in every category up to 180 days."
  - "Placebo subjects have a planned dose of zero, so every placebo dose statistic is 0. The Total column pools the three treatment groups."
columns:
  order: [Placebo, "Xanomeline Low Dose", "Xanomeline High Dose", Total]
format:
  digits:
    p: 1
    mean: 1
    sd: 2
    median: 1
    min: 1
    max: 1
