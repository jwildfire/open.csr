# ------------------------------------------------------------------------------
# t-exposure — Summary of Planned Exposure to Study Drug, as of End of Study
# ------------------------------------------------------------------------------
# Target: Table 14-4.01 of the CDISCPILOT01 clinical study report (27 June 2006).
#
# The reference summarises two ADSL columns — average daily dose (AVGDD) and
# cumulative dose at end of study (CUMDOSE) — for the safety population and, in
# a second column group, for the subjects who completed Week 24. No exposure
# dataset is involved: the pilot's ADaM package ships no ADEX, and the table
# never needed one. Until v0.4.0 this display read the pharmaverse
# re-derivation's ADEX and grouped by an actual-treatment column that moved
# twelve subjects between arms; it now reads the study's own package and agrees
# with the rest of the report on who was in it (D0032 R2, #60).
#
# The reference lays the two populations out as column groups. v0 supports one
# grouping variable, which the treatment column uses, so the completers appear
# as a second block of ROWS under the same three columns — the transposition
# t-vitals makes. Every number is the reference's number; only the axis differs.
#
# Two blocks the reference table does not carry are kept, and say so on the
# display: duration of treatment in days (ADSL TRTDUR) and the cumulative
# exposure categories over it. Section 12.1's approved narrative quotes them,
# and the analysis names `duration` and `dur_*` are the addresses that prose
# binds, unchanged from the ADEX-based display so the words still resolve.
# ------------------------------------------------------------------------------
id: t-exposure
title: "Summary of Planned Exposure to Study Drug, as of End of Study"
regulatory_id: EXT01
type: table
dataset: adsl
analysis_set: safety
denominator: adsl
group:
  - TRT01A
total: true
analyses:
  - name: avg_daily_dose
    method: continuous
    label: "Average daily dose (mg) — safety population"
    variables: [AVGDD]
  - name: total_dose
    method: continuous
    label: "Cumulative dose at end of study (mg) — safety population"
    variables: [CUMDOSE]
  - name: avg_daily_dose_comp
    method: continuous
    label: "Average daily dose (mg) — completers at Week 24"
    variables: [AVGDD]
    filter: "COMP24FL == 'Y'"
  - name: total_dose_comp
    method: continuous
    label: "Cumulative dose at end of study (mg) — completers at Week 24"
    variables: [CUMDOSE]
    filter: "COMP24FL == 'Y'"
  - name: duration
    method: continuous
    label: "Duration of treatment (days)"
    variables: [TRTDUR]
  - name: dur_any
    method: subject_count
    label: "Treated for at least 1 day"
    variable: EXPCAT
    filter: "!is.na(TRTDUR) & TRTDUR >= 1"
  - name: dur_30
    method: subject_count
    label: "Treated for at least 30 days"
    variable: EXPCAT
    filter: "!is.na(TRTDUR) & TRTDUR >= 30"
  - name: dur_90
    method: subject_count
    label: "Treated for at least 90 days"
    variable: EXPCAT
    filter: "!is.na(TRTDUR) & TRTDUR >= 90"
  - name: dur_180
    method: subject_count
    label: "Treated for at least 180 days"
    variable: EXPCAT
    filter: "!is.na(TRTDUR) & TRTDUR >= 180"
