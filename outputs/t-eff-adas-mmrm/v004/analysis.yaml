id: t-eff-adas-mmrm
title: "ADAS-Cog (11) - Repeated Measures Analysis of Change from Baseline to Week 24"
regulatory_id: EFT08
type: table
dataset: adqsadas
analysis_set: efficacy
denominator: adsl
sources: phuse
group:
  - TRTP
total: false
analyses:
  - name: population
    method: continuous
    custom: population_n
    label: "Subjects in the analysis population"
    filter: "PARAMCD == 'ACTOT'"

  # Observed cases only. A repeated-measures model handles missing visits by
  # modelling the within-subject covariance, so feeding it carry-forward
  # records would count one measurement several times. Selecting this way gives
  # 539 records over 234 subjects, which is what the reference report's own
  # PROC MIXED output states it used.
  - name: mmrm
    method: continuous
    custom: mmrm_change
    label: "Mixed model for repeated measures of the change from baseline"
    variables: [CHG]
    filter: "PARAMCD == 'ACTOT' & ANL01FL == 'Y' & AVISITN %in% c(8, 16, 24) & !(DTYPE %in% 'LOCF')"
    response: CHG
    subject: USUBJID
    visit: AVISITN
    visit_levels: [8, 16, 24]
    treatment: TRTP
    treatment_levels: ["Placebo", "Xanomeline Low Dose", "Xanomeline High Dose"]
    factors: [SITEGR1]
    covariates: [BASE]
    # Treatment and the baseline score each interact with visit; site group does
    # not. This is the model the SAP names in section 10.1.1, and the reference
    # report's PROC MIXED output confirms it: 31 columns in X is exactly
    # 1 + 11 site groups + 3 visits + 3 treatments + 9 treatment-by-visit
    # + 1 baseline + 3 baseline-by-visit.
    visit_interactions: [BASE, TRTP]
    # The reference report's least-squares means are the treatment main effect,
    # averaged over all three post-baseline visits rather than conditioned on
    # Week 24. See the display's footnotes: the title says Week 24, the number
    # is a visit-averaged estimate, and this is where that is decided.
    lsmeans_over: all
    conf_level: 0.95
    contrasts:
      - { name: xan_vs_placebo, test: "Xanomeline Low Dose",
          reference: "Placebo", column: "Xanomeline Low Dose" }
      - { name: xan_vs_placebo, test: "Xanomeline High Dose",
          reference: "Placebo", column: "Xanomeline High Dose" }
      - { name: high_vs_low, test: "Xanomeline High Dose",
          reference: "Xanomeline Low Dose", column: "Xanomeline High Dose" }
