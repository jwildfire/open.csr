# ------------------------------------------------------------------------------
# assembly.yaml — the per-CSR configuration for the open.csr v0 demonstration.
# ------------------------------------------------------------------------------
# sections.yaml says what an ICH E3 CSR IS. This file says what THIS report puts
# in it: which Text Library blocks populate which sections, which displays are
# rendered in-text, and which displays occupy which Section 14 slot.
#
# It deliberately claims only the sections the v0 demo actually fills. Every other
# E3 section still appears in the assembled document as a heading marked "not
# populated in this demonstration" — honest about scope, and it keeps the full
# skeleton visible (design.md §10, delivery phase v0).
#
# Numbering (design decision D6): display numbers are NOT written here. The
# assembler derives 14.x positions from `post_text` order at build time, so a
# reordering is a one-line diff and the display slug never changes.
# ------------------------------------------------------------------------------
template: ich-e3

study:
  id: CDISCPILOT01
  title: >-
    Safety and Efficacy of the Xanomeline Transdermal Therapeutic System (TTS) in
    Patients with Mild to Moderate Alzheimer's Disease
  short_title: "Xanomeline TTS in Mild to Moderate Alzheimer's Disease"
  phase: "Phase 2"
  indication: "Mild to moderate Alzheimer's disease"
  product: "Xanomeline Transdermal Therapeutic System (TTS)"
  sponsor: "open.csr demonstration report (CDISC pilot study data)"
  cutoff: "2014-07-01"
  design: "Randomised, double-blind, placebo-controlled, parallel-group"
  treatment_groups: ["Placebo", "Xanomeline Low Dose", "Xanomeline High Dose"]
  primary_analysis_set: "Safety Analysis Set"
  data_source: "CDISCPILOT01 ADaM — the CDISC pilot's own package (phuse-org/phuse-scripts, data/adam/cdiscpilot01), every display"
  scope_note: >-
    Safety and efficacy demonstration. Every display is built from the CDISC
    pilot's own ADaM package, vendored from phuse-org/phuse-scripts, since
    v0.4.0 (D0032 R2): the pharmaverse re-derivation of the same study assigns
    twelve subjects to a different actual treatment, and a report that read both
    told two versions of the study. The re-derivation remains readable and is
    measured against the package by qc/source-agreement.R; nothing this
    document places reads it. Section 11.4 remains unpopulated: its narrative
    analysis of efficacy is not yet written.

# Where the assembler writes the auto-generated provenance appendix.
provenance_section: "16.1.9"

# ---------------------------------------------------------------------- narrative
# `text`      Text Library block IDs, in order.
# `displays`  rendered here as the display's `in_text` variant (a reduced or
#             thresholded rendering of the same ARD that feeds Section 14).
slots:
  - section: "5.2"
    text: [TXT-E3-0502]

  - section: "5.3"
    text: [TXT-E3-0503]

  - section: "9.1"
    text: [TXT-E3-0901]

  - section: "9.8"
    text: [TXT-E3-0908]

  - section: "10.1"
    text: [TXT-E3-1001, TXT-E3-1002]
    displays: [t-disposition, f-disposition]

  - section: "11.1"
    text: [TXT-E3-1101]

  - section: "11.2"
    text: [TXT-E3-1102]
    displays: [t-demographics]

  - section: "12.1"
    text: [TXT-E3-1201]
    displays: [t-exposure]

  - section: "12.2.1"
    text: [TXT-E3-1221]
    displays: [t-ae-overview]

  - section: "12.2.2"
    text: [TXT-E3-1222]
    displays: [t-ae-common]

  - section: "12.2.3"
    displays: [t-ae-incidence]

  - section: "12.2.4"
    text: [TXT-E3-1224]

  - section: "12.5"
    displays: [t-weight]

  - section: "12.3.1"
    text: [TXT-E3-1231]
    displays: [l-ae-serious]

  - section: "12.6"
    text: [TXT-E3-1206]

  - section: "13"
    text: [TXT-E3-1300]

# ---------------------------------------------------------------------- post-text
# Section 14 assignment. Order within a section determines the assigned number:
# the first display under "14.1" becomes Table 14.1.1, the second 14.1.2, and so
# on. Assigned numbers may never collide with a section number in sections.yaml —
# the assembler treats a collision as a build failure (RPT-ASM-004).
post_text:
  # t-populations and t-end-of-study rebuild the reference report's Tables 14-1.01
  # and 14-1.02, which that report prints FIRST in this section. They are appended
  # rather than placed first, so they assign as 14.1.3 and 14.1.4 here and their
  # numbers deliberately do not match the reference's. Ordering Section 14 to match
  # the reference is a one-line reorder of this list and nothing else — no display
  # specification, no prose, no test names a number (D6) — but it renumbers
  # t-disposition and t-demographics, which belong to no single display's work.
  # Whoever owns Section 14 as a whole should make that call once, not a worker
  # landing two tables.
  - section: "14.1"
    displays: [t-disposition, t-demographics, t-populations, t-end-of-study, t-subjects-by-site, f-disposition]

  # Efficacy. Ordered as the CDISCPILOT01 reference report orders its own
  # Section 14.3 efficacy displays — the two Week-24 primaries first, then the
  # other visits, then the subgroups, then the over-time summary, the supportive
  # repeated-measures analysis and the secondary endpoint. The assigned numbers
  # here are 14.2.1 onwards and have nothing to do with the reference report's
  # 14-3.xx labels: identity is the slug, the number is assigned from this order
  # at build time (D6).
  - section: "14.2"
    # The efficacy displays, in the order the reference report prints them:
    # ADAS-Cog and CIBIC+ alternate through Tables 14-3.01 to 14-3.06, then the
    # ADAS-Cog subgroups and supportive analyses, then the CIBIC+ categorical
    # analysis at 14-3.13, then the study's one figure. Numbers are assigned from
    # this order at build time (D6) and appear in no source file, so a display
    # added between two of these renumbers the rest by itself.
    #
    # Merge note: the ADAS-Cog set and the CIBIC+/time-to-event set arrived on
    # separate branches, each adding its own "14.2" block. Git merged them into
    # TWO entries with the same section number and no conflict — clean, and
    # wrong. This is the single interleaved list.
    displays:
      - t-eff-adas-wk24          # 14-3.01
      - t-cibic-week24           # 14-3.02
      - t-eff-adas-wk8           # 14-3.03
      - t-cibic-week8            # 14-3.04
      - t-eff-adas-wk16          # 14-3.05
      - t-cibic-week16           # 14-3.06
      - t-eff-adas-wk24-completers  # 14-3.07
      - t-eff-adas-wk24-male     # 14-3.08
      - t-eff-adas-wk24-female   # 14-3.09
      - t-eff-adas-overtime      # 14-3.10
      - t-eff-adas-mmrm          # 14-3.11
      - t-eff-npix-mean          # 14-3.12
      - t-cibic-categorical      # 14-3.13
      - f-derm-time-to-event               # Figure 14-1

  - section: "14.3.1"
    displays: [t-exposure, t-ae-overview, t-ae-common, t-ae-incidence]

  - section: "14.3.2"
    displays: [l-ae-serious, t-sae-incidence]

  - section: "14.3.5"
    displays: [t-vitals, t-vitals-change, t-weight, t-conmeds]
