    slug: listing-efficacy-response
    content: [post_text_index]

  - number: "16.2.7"
    title: "Adverse Event Listings (each patient)"
    slug: listing-adverse-events
    content: [post_text_index]

  - number: "16.2.8"
    title: "Listing of Individual Laboratory Measurements by Patient, When Required by Regulatory Authorities"
    slug: listing-laboratory
    content: [post_text_index]

  - number: "16.3"
    title: "Case Report Forms"
    slug: appendix-crfs
    content: []

