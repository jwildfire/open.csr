# ------------------------------------------------------------------------------
# ICH E3 — machine-readable Clinical Study Report document model
# ------------------------------------------------------------------------------
# Source of structure: ICH Harmonised Tripartite Guideline E3, "Structure and
# Content of Clinical Study Reports", Step 4, 30 November 1995 (unrevised; the
# only supplement is E3 Q&A (R1)). Section and subsection numbers and titles are
# E3's own; this file encodes them as data. Nothing here is copied from a
# proprietary template — TransCelerate's CSR template and CORE Reference informed
# WHICH sections carry displays in practice, not the text below.
#
# Why this file exists: ICH M11 (Step 4, 19 Nov 2025) gave protocols a structured,
# machine-readable standard. There is no M11 analogue for the CSR, and no public
# machine-readable E3 model. This is open.csr's attempt at one.
#
# Schema (contracts.md §7):
#   number   E3 section number, dotted. Unique. Level is derived from dot depth.
#   title    E3 heading text.
#   slug     stable kebab-case identity. Unique. Never renumber a slug.
#   content  zero or more of:
#              text                  narrative supplied by Text Library blocks
#              in_text_display       reduced/thresholded display rendered inline
#              post_text_index       container for post-text displays (Section 14)
#              generated_provenance  assembler-generated content (16.1.9)
#            An empty list means a structural heading (a container, or a section
#            the assembler generates natively — e.g. the Table of Contents).
#   note     optional E3 guidance worth carrying with the structure.
#
# Content assignment is per-CSR and lives in assembly.yaml; this file says what
# each E3 section IS, never what a given study puts in it.
# ------------------------------------------------------------------------------
model:
  id: ich-e3
  title: "ICH E3 Clinical Study Report"
  version: "1.0.0"
  source: "ICH E3 (1995), Step 4; E3 Q&A (R1)"
  reference: "https://database.ich.org/sites/default/files/E3_Guideline.pdf"
  note: >-
    E3 is a guideline, not a rigid requirement. Its Introduction states that the
    sequence and grouping of topics may be changed where more logical for a
    particular study, and that "the numbering should then be adapted
    accordingly". open.csr therefore treats display identity as the slug and the
    14.x number as a build-time assignment (design decision D6).

sections:
  # ---------------------------------------------------------------- 1–4 front matter
  - number: "1"
    title: "Title Page"
    slug: title-page
    content: [text]
    note: >-
      E3 lists 14 required title-page fields, including study title, protocol
      identifier, indication, a brief statement of design, investigational
      product, study phase, study initiation/completion dates, sponsor and
      responsible medical officer, and a statement of GCP compliance.

  - number: "2"
    title: "Synopsis"
    slug: synopsis
    content: [text]
    note: "E3 Annex I gives a worked example; usually limited to 3 pages."

  - number: "3"
    title: "Table of Contents for the Individual Clinical Study Report"
    slug: table-of-contents
    content: []
    note: "Generated by the assembler from the populated section tree."

  - number: "4"
    title: "List of Abbreviations and Definition of Terms"
    slug: abbreviations
    content: [text]

  # ------------------------------------------------------------------------ 5 ethics
  - number: "5"
    title: "Ethics"
    slug: ethics
    content: []

  - number: "5.1"
    title: "Independent Ethics Committee (IEC) or Institutional Review Board (IRB)"
    slug: ethics-iec-irb
    content: [text]

  - number: "5.2"
    title: "Ethical Conduct of the Study"
    slug: ethics-conduct
    content: [text]

  - number: "5.3"
    title: "Patient Information and Consent"
    slug: ethics-consent
    content: [text]

  # ------------------------------------------------------------ 6 administrative
  - number: "6"
    title: "Investigators and Study Administrative Structure"
    slug: administrative-structure
    content: [text]
    note: "Details cross-reference Appendix 16.1.4."

  # ------------------------------------------------------------- 7–8 background
  - number: "7"
    title: "Introduction"
    slug: introduction
    content: [text]

  - number: "8"
    title: "Study Objectives"
    slug: objectives
    content: [text]

  # ------------------------------------------------ 9 investigational plan
  - number: "9"
    title: "Investigational Plan"
    slug: investigational-plan
    content: []

  - number: "9.1"
    title: "Overall Study Design and Plan: Description"
    slug: study-design
    content: [text, in_text_display]
    note: "Commonly carries a design schematic and the schedule of assessments."

  - number: "9.2"
    title: "Discussion of Study Design, Including the Choice of Control Groups"
    slug: design-rationale
    content: [text]

  - number: "9.3"
    title: "Selection of Study Population"
    slug: study-population
    content: []

  - number: "9.3.1"
    title: "Inclusion Criteria"
    slug: inclusion-criteria
    content: [text]

  - number: "9.3.2"
    title: "Exclusion Criteria"
    slug: exclusion-criteria
    content: [text]

  - number: "9.3.3"
    title: "Removal of Patients from Therapy or Assessment"
    slug: patient-removal
    content: [text]

  - number: "9.4"
    title: "Treatments"
    slug: treatments
    content: []

  - number: "9.4.1"
    title: "Treatments Administered"
    slug: treatments-administered
    content: [text]

  - number: "9.4.2"
    title: "Identity of Investigational Product(s)"
