    slug: appendix-audit-certificates
    content: [text]

  - number: "16.1.9"
    title: "Documentation of Statistical Methods"
    slug: appendix-statistical-methods
    content: [text, generated_provenance]
    note: >-
      E3 reserved this slot for statistical-methods documentation in 1995.
      open.csr fills it mechanically: for every display, the analysis and display
      spec hashes, the input dataset hashes and row counts, the R and package
      versions, and the git commit that produced the ARD. This is the artifact
      that turns the traceability claim into something a reviewer can inspect.

  - number: "16.1.10"
    title: "Documentation of Inter-laboratory Standardisation Methods and Quality Assurance Procedures if Used"
    slug: appendix-lab-standardisation
    content: [text]

  - number: "16.1.11"
    title: "Publications Based on the Study"
    slug: appendix-publications
    content: [text]

  - number: "16.1.12"
    title: "Important Publications Referenced in the Report"
    slug: appendix-referenced-publications
    content: [text]

  - number: "16.2"
    title: "Patient Data Listings"
    slug: appendix-patient-listings
    content: []

  - number: "16.2.1"
    title: "Discontinued Patients"
    slug: listing-discontinued
    content: [post_text_index]

  - number: "16.2.2"
    title: "Protocol Deviations"
    slug: listing-deviations
    content: [post_text_index]

  - number: "16.2.3"
    title: "Patients Excluded from the Efficacy Analysis"
    slug: listing-efficacy-exclusions
    content: [post_text_index]

  - number: "16.2.4"
    title: "Demographic Data"
    slug: listing-demographics
    content: [post_text_index]

  - number: "16.2.5"
    title: "Compliance and/or Drug Concentration Data (if available)"
    slug: listing-compliance
    content: [post_text_index]

  - number: "16.2.6"
