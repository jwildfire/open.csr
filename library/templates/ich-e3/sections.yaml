    content: [text]
    note: "Batch listing, where more than one batch was used, goes to 16.1.6."

  - number: "9.4.3"
    title: "Method of Assigning Patients to Treatment Groups"
    slug: treatment-assignment
    content: [text]

  - number: "9.4.4"
    title: "Selection of Doses in the Study"
    slug: dose-selection
    content: [text]

  - number: "9.4.5"
    title: "Selection and Timing of Dose for Each Patient"
    slug: dose-timing
    content: [text]

  - number: "9.4.6"
    title: "Blinding"
    slug: blinding
    content: [text]

  - number: "9.4.7"
    title: "Prior and Concomitant Therapy"
    slug: concomitant-therapy
    content: [text, in_text_display]

  - number: "9.4.8"
    title: "Treatment Compliance"
    slug: treatment-compliance
    content: [text, in_text_display]

  - number: "9.5"
    title: "Efficacy and Safety Variables"
    slug: efficacy-safety-variables
    content: []

  - number: "9.5.1"
    title: "Efficacy and Safety Measurements Assessed and Flow Chart"
    slug: measurements-assessed
    content: [text, in_text_display]

  - number: "9.5.2"
    title: "Appropriateness of Measurements"
    slug: measurement-appropriateness
    content: [text]

  - number: "9.5.3"
    title: "Primary Efficacy Variable(s)"
    slug: primary-efficacy-variable
    content: [text]

  - number: "9.5.4"
    title: "Drug Concentration Measurements"
    slug: drug-concentration
    content: [text]

  - number: "9.6"
    title: "Data Quality Assurance"
    slug: data-quality-assurance
    content: [text]

  - number: "9.7"
    title: "Statistical Methods Planned in the Protocol and Determination of Sample Size"
    slug: planned-statistical-methods
    content: []

  - number: "9.7.1"
    title: "Statistical and Analytical Plans"
    slug: statistical-analytical-plans
    content: [text]
    note: "Full documentation of statistical methods belongs in Appendix 16.1.9."

  - number: "9.7.2"
    title: "Determination of Sample Size"
    slug: sample-size
    content: [text]

  - number: "9.8"
    title: "Changes in the Conduct of the Study or Planned Analyses"
    slug: conduct-changes
    content: [text]

  # ------------------------------------------------------------- 10 study patients
  - number: "10"
    title: "Study Patients"
    slug: study-patients
    content: []

  - number: "10.1"
    title: "Disposition of Patients"
    slug: disposition
    content: [text, in_text_display]
    note: >-
      E3 Annex IVa gives an example disposition flow; discontinued patients are
      listed in 16.2.1 and summarised post-text in 14.1.

  - number: "10.2"
    title: "Protocol Deviations"
    slug: protocol-deviations
    content: [text, in_text_display]
    note: "Individual deviations are listed in 16.2.2."

  # --------------------------------------------------------- 11 efficacy evaluation
  - number: "11"
    title: "Efficacy Evaluation"
    slug: efficacy-evaluation
    content: []

  - number: "11.1"
    title: "Data Sets Analysed"
    slug: data-sets-analysed
    content: [text, in_text_display]
    note: "Patients excluded from the efficacy analysis are listed in 16.2.3."

  - number: "11.2"
    title: "Demographic and Other Baseline Characteristics"
    slug: demographics
    content: [text, in_text_display]
    note: "Individual demographic data are listed in 16.2.4."

  - number: "11.3"
    title: "Measurements of Treatment Compliance"
    slug: compliance-measurements
    content: [text, in_text_display]

  - number: "11.4"
    title: "Efficacy Results and Tabulations of Individual Patient Data"
    slug: efficacy-results
    content: []

  - number: "11.4.1"
    title: "Analysis of Efficacy"
    slug: efficacy-analysis
    content: [text, in_text_display]

  - number: "11.4.2"
    title: "Statistical/Analytical Issues"
    slug: statistical-issues
    content: []
    note: >-
      E3 enumerates eight statistical issues; each is a reusable prose block in
      the Text Library.

  - number: "11.4.2.1"
    title: "Adjustments for Covariates"
    slug: covariate-adjustment
    content: [text]

  - number: "11.4.2.2"
    title: "Handling of Dropouts or Missing Data"
    slug: missing-data
    content: [text]

  - number: "11.4.2.3"
    title: "Interim Analyses and Data Monitoring"
    slug: interim-analyses
    content: [text]

  - number: "11.4.2.4"
    title: "Multicentre Studies"
    slug: multicentre
    content: [text]

  - number: "11.4.2.5"
    title: "Multiple Comparison/Multiplicity"
    slug: multiplicity
    content: [text]

  - number: "11.4.2.6"
    title: "Use of an \"Efficacy Subset\" of Patients"
    slug: efficacy-subset
    content: [text]

  - number: "11.4.2.7"
    title: "Active-Control Studies Intended to Show Equivalence"
    slug: equivalence
    content: [text]

  - number: "11.4.2.8"
    title: "Examination of Subgroups"
    slug: subgroups
    content: [text, in_text_display]

  - number: "11.4.3"
    title: "Tabulation of Individual Response Data"
    slug: individual-response-data
    content: [text]
    note: "Cross-references the listings in 16.2.6."

  - number: "11.4.4"
    title: "Drug Dose, Drug Concentration, and Relationships to Response"
    slug: dose-concentration-response
    content: [text, in_text_display]

  - number: "11.4.5"
    title: "Drug-Drug and Drug-Disease Interactions"
    slug: interactions
    content: [text]

  - number: "11.4.6"
    title: "By-Patient Displays"
    slug: by-patient-displays
    content: [text]

  - number: "11.4.7"
    title: "Efficacy Conclusions"
    slug: efficacy-conclusions
    content: [text]

  # ----------------------------------------------------------- 12 safety evaluation
  - number: "12"
    title: "Safety Evaluation"
    slug: safety-evaluation
    content: []

  - number: "12.1"
    title: "Extent of Exposure"
    slug: extent-of-exposure
    content: [text, in_text_display]

  - number: "12.2"
    title: "Adverse Events (AEs)"
    slug: adverse-events
    content: []

  - number: "12.2.1"
    title: "Brief Summary of Adverse Events"
    slug: ae-brief-summary
    content: [text, in_text_display]

  - number: "12.2.2"
    title: "Display of Adverse Events"
    slug: ae-display
    content: [text, in_text_display]
    note: >-
      In practice the in-text display is a frequency-thresholded rendering of the
      full post-text SOC/PT table — one ARD, two variants.

  - number: "12.2.3"
    title: "Analysis of Adverse Events"
    slug: ae-analysis
    content: [text, in_text_display]

  - number: "12.2.4"
    title: "Listing of Adverse Events by Patient"
    slug: ae-listing
    content: [text]
    note: "The listing itself is Appendix 16.2.7; this section points to it."

  - number: "12.3"
    title: "Deaths, Other Serious Adverse Events, and Other Significant Adverse Events"
    slug: deaths-saes
    content: []

  - number: "12.3.1"
    title: "Listing of Deaths, Other Serious Adverse Events and Other Significant Adverse Events"
    slug: deaths-saes-listing
    content: [text, in_text_display]

  - number: "12.3.1.1"
    title: "Deaths"
    slug: deaths
    content: [text]

  - number: "12.3.1.2"
    title: "Other Serious Adverse Events"
    slug: other-serious-aes
    content: [text]

  - number: "12.3.1.3"
    title: "Other Significant Adverse Events"
    slug: other-significant-aes
    content: [text]

  - number: "12.3.2"
    title: "Narratives of Deaths, Other Serious and Certain Other Significant Adverse Events"
    slug: sae-narratives
    content: [text]
    note: >-
      Prose, not a table — but E3 also reserves 14.3.3 for the narratives. The
      narratives are a Text Library product built from the same ADaM spine as the
      AE displays.

  - number: "12.3.3"
    title: "Analysis and Discussion of Deaths, Other Serious and Other Significant Adverse Events"
    slug: sae-discussion
    content: [text]

  - number: "12.4"
    title: "Clinical Laboratory Evaluation"
    slug: laboratory-evaluation
    content: []

  - number: "12.4.1"
    title: "Listing of Individual Laboratory Measurements by Patient and Each Abnormal Laboratory Value"
    slug: lab-listings
    content: [text]
    note: "Listings appear in 16.2.8; abnormal values also in 14.3.4."

  - number: "12.4.2"
    title: "Evaluation of Each Laboratory Parameter"
    slug: lab-parameter-evaluation
    content: []

  - number: "12.4.2.1"
    title: "Laboratory Values Over Time"
    slug: lab-values-over-time
    content: [text, in_text_display]

  - number: "12.4.2.2"
    title: "Individual Patient Changes"
    slug: lab-individual-changes
    content: [text, in_text_display]

  - number: "12.4.2.3"
    title: "Individual Clinically Significant Abnormalities"
    slug: lab-significant-abnormalities
    content: [text]

  - number: "12.5"
    title: "Vital Signs, Physical Findings and Other Observations Related to Safety"
    slug: vital-signs
    content: [text, in_text_display]

  - number: "12.6"
    title: "Safety Conclusions"
    slug: safety-conclusions
    content: [text]

  # -------------------------------------------------------------- 13 discussion
  - number: "13"
    title: "Discussion and Overall Conclusions"
    slug: discussion-conclusions
    content: [text]
    note: >-
      Pure narrative and the hardest target for automated drafting: it requires
      ranking findings by importance and inference, which the Pfizer LLM
      challenge (JAMIA Open 2024;7(2):ooae043) found could not be automated.
      open.csr treats it as generated-tier text that stays draft until a human
      approves it.

  # ------------------------------------------------------------- 14 post-text TFLs
  - number: "14"
    title: "Tables, Figures and Graphs Referred to but not Included in the Text"
    slug: post-text-displays
    content: [post_text_index]
    note: >-
      E3's three-level rule: overall summaries may sit in the text, other summary
      tables/figures/listings belong here, individual patient data go to 16.2,
      and all individual data (US archival) to 16.4.

  - number: "14.1"
    title: "Demographic Data"
    slug: post-text-demographic
    content: [post_text_index]

  - number: "14.2"
    title: "Efficacy Data"
    slug: post-text-efficacy
    content: [post_text_index]

  - number: "14.3"
    title: "Safety Data"
    slug: post-text-safety
    content: []

  - number: "14.3.1"
    title: "Displays of Adverse Events"
    slug: post-text-ae-displays
    content: [post_text_index]

  - number: "14.3.2"
    title: "Listings of Deaths, Other Serious and Significant Adverse Events"
    slug: post-text-death-sae-listings
    content: [post_text_index]

  - number: "14.3.3"
    title: "Narratives of Deaths, Other Serious and Certain Other Significant Adverse Events"
    slug: post-text-sae-narratives
    content: [text]
    note: "Prose block inside the TFL section — the Text Library/TFL Library seam."

  - number: "14.3.4"
    title: "Abnormal Laboratory Value Listing (Each Patient)"
    slug: post-text-abnormal-labs
    content: [post_text_index]

  - number: "14.3.5"
    title: "Displays of Vital Signs, Weight and Concomitant Medications"
    slug: post-text-vitals-conmeds
    content: [post_text_index]
    note: >-
      NOT AN E3 SUBSECTION. E3 enumerates four subsections under 14.3 - adverse
      event displays, death and serious adverse event listings, narratives, and the
      abnormal laboratory value listing - and provides no slot for the vital signs,
      weight and concomitant medication data its own Sections 12.5 and 12.6 require
      the report to present. This subsection is an addition made by this document
      model, in the place E3 leaves for the rest of the safety data, and it is
      declared here rather than folded into 14.3.4 so that nothing about it looks
      like it came from the guideline. The reference report for this study made the
      same move under its own numbering, as Table 14-7.01 to Table 14-7.04.

  # -------------------------------------------------------------- 15 references
  - number: "15"
    title: "Reference List"
    slug: references
    content: [text]

