    content: []
    note: >-
      The safety evaluation is kept through adverse events, deaths and other
      serious adverse events, and the safety conclusions. E3's
      parameter-by-parameter laboratory evaluation (12.4) and its vital-sign
      section (12.5) are absent: an abbreviated report may summarise that detail
      rather than reproduce it, and the underlying patient listings remain
      reachable through Section 16.2.

  - number: "12.1"
    title: "Extent of Exposure"
    slug: extent-of-exposure
