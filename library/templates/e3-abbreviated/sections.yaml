# ------------------------------------------------------------------------------
# Abbreviated clinical study report — machine-readable document model
# ------------------------------------------------------------------------------
# ICH E3's Introduction contemplates a reduced report for a study that is not
# intended to support a claim of efficacy or safety — enough detail of design and
# results to let a reviewer judge the study, without the full apparatus of an
# efficacy submission. E3 describes the idea; it does not print a section list for
# one, and no public machine-readable model of an abbreviated report exists.
#
# SO THE SUBSET BELOW IS OPEN.CSR'S, NOT E3'S. The rule it follows is stated here,
# once, so a reader can disagree with the rule in one place instead of arguing
# section by section:
#
#   a. Everything that describes how the study was conducted is kept in full —
#      E3's front matter (1 to 4), ethics (5), administrative structure (6),
#      introduction (7), objectives (8), the investigational plan's descriptive
#      sections (9.1, 9.3, 9.4, 9.5.1, 9.6, 9.7, 9.8), study patients (10), the
#      analysis sets and baseline characteristics (11.1 to 11.3), the discussion
#      (13), the post-text displays (14, including the narratives at 14.3.3) and
#      the reference list (15).
#
#   b. The efficacy-analysis apparatus is dropped, and that is what makes the
#      report abbreviated: Section 11.4 and all fifteen of its subsections, the
#      efficacy-specific parts of Section 9.5 (9.5.2 to 9.5.4), and the discussion
#      of design choice and control groups (9.2).
#
#   c. Safety is kept through adverse events, deaths and other serious adverse
#      events, and the safety conclusions (12.1 to 12.3, 12.6). E3's
#      parameter-by-parameter laboratory (12.4) and vital-sign (12.5) evaluations
#      are dropped as detail an abbreviated report may summarise rather than
#      reproduce, and the post-text slot that belongs to them (14.3.4) goes with
#      them. This is the clause of the rule most worth arguing with.
#
#   d. Section 16 keeps only the appendices a report of this kind actually cites:
#      the protocol (16.1.1), the consent documentation (16.1.3), the
#      randomisation scheme (16.1.7), the documentation of statistical methods
#      (16.1.9), and the four patient-data listings the retained prose points at
#      (16.2.1, 16.2.3, 16.2.4, 16.2.7).
#
# Seventy-five sections, against the full report's one hundred and nineteen.
#
# A RESTRICTION, NOT A REWRITE. Every section below carries the number, title,
# slug and content declaration it has in library/templates/ich-e3/sections.yaml,
# unchanged — nothing renamed, nothing renumbered, nothing re-scoped. A reader
# moving between the abbreviated report and the full report is reading one
# numbering scheme, and a display carries the same number in both. A test in
# tests/unit/assemble-template-subsets.test.js checks that section by section, so
# "subset" is a property of the file rather than a claim in this comment.
#
# NO NEW PROSE. The assembly beside this file populates these sections with the
# same fifteen text blocks the full report already uses. Not one sentence was
# written for this document. The synopsis needed eighteen new blocks because the
# report's prose cross-references E3 section numbers a synopsis has not got; an
# abbreviated report keeps E3's numbers, so the same prose resolves unchanged.
#
# LICENCE. Encoded from ICH E3 (1995), Step 4, a public guideline, on the same
# footing as the model it restricts. Nothing here is derived from a sponsor or CRO
# template, or from any R Consortium Submissions Working Group pilot repository:
# pilots 1, 2 and 3 are GPL-3.0 (one-way incompatible with this Apache-2.0 project
# in the direction reuse would need) and pilots 4, 5-dev and 6, the ADRG
# automation pipeline and most of the eCTD "-to-fda" packages carry no licence at
# all. See reports/csr-template-objects-2026-08-26 on the hub.
#
# Schema: identical to library/templates/ich-e3/sections.yaml (contracts.md §7).
# ------------------------------------------------------------------------------
model:
  id: e3-abbreviated
  title: "Abbreviated Clinical Study Report (ICH E3)"
  version: "1.0.0"
  source: "ICH E3 (1995), Step 4 — Introduction, restricted per the rule in this file"
  reference: "https://database.ich.org/sites/default/files/E3_Guideline.pdf"
  note: >-
    A study not intended to support a claim still has to be reported, and E3
    allows that report to be shorter. This model is the full E3 document model
    with the efficacy-analysis apparatus and the uncited appendices removed. It
    shares the report's numbering exactly, so the same prose, the same displays
    and the same display numbers carry over without a single edit.

sections:
  - number: "1"
    title: "Title Page"
    slug: title-page
    content: [text]

  - number: "2"
    title: "Synopsis"
    slug: synopsis
    content: [text]
    note: >-
      Kept, and worth naming: the synopsis this section carries is itself a
      template object in this library (library/templates/e3-synopsis), assembled
      from the same study and the same values. The framework has no way to embed
      one assembled document inside another, so the two are built side by side
      rather than nested. That is a real limitation, not a design position.

  - number: "3"
    title: "Table of Contents for the Individual Clinical Study Report"
    slug: table-of-contents
    content: []

  - number: "4"
    title: "List of Abbreviations and Definition of Terms"
    slug: abbreviations
    content: [text]

  - number: "5"
    title: "Ethics"
    slug: ethics
    content: []

