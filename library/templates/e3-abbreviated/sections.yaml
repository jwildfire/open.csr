    content: [post_text_index]
    note: >-
      Populated. This section was declared and empty for as long as open.csr had no
      efficacy analysis dataset for CDISCPILOT01 (design decision D12); dropping the
      heading would have hidden the gap. The study's own ADaM package supplied the
      data, and the section now carries the CIBIC+ analyses and the time-to-event
      figure — not yet all thirteen efficacy tables the reference report carries.

