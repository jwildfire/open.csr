    content: []
    note: >-
      Efficacy is kept only as far as the analysis sets and the baseline
      characteristics. Section 11.4 (Efficacy Results and Tabulations of
      Individual Patient Data) and all fifteen of its subsections are absent, and
      that single cut is what makes this report abbreviated rather than short.

