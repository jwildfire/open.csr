# ------------------------------------------------------------------------------
# assembly.yaml — the abbreviated clinical study report for the open.csr
# demonstration study, CDISCPILOT01.
# ------------------------------------------------------------------------------
# sections.yaml in this directory says what an abbreviated ICH E3 report IS. This
# file says what THIS report puts in it — and the answer is: exactly what the full
# report puts in it.
#
# THE SLOTS AND THE POST-TEXT BLOCK BELOW ARE IDENTICAL TO
# library/templates/ich-e3/assembly.yaml. Same fifteen text blocks in the same
# fourteen sections, same six displays, same in-text placements, same post-text
# order. Not a sentence was written for this document, and no display was
# re-specified for it. The two reports differ in their DOCUMENT MODEL, not in
# what they say — which is the property this template object exists to
# demonstrate, and the reason it cost nothing to add.
#
# That is not true of every second document. The synopsis needed eighteen new text
# blocks, because the report's prose cross-references E3 section numbers a
# synopsis has not got (Section 16.2.1, Section 14.2, Section 12.3.2). An
# abbreviated report keeps E3's numbering, so every one of those cross-references
# resolves against this model unchanged — and the model retains the referenced
# sections precisely so that they do.
#
# WHAT A READER SEES THAT THE FULL REPORT DOES NOT GIVE THEM. Seventy-five
# headings instead of one hundred and nineteen, with the efficacy-analysis
# apparatus absent rather than present-and-empty. The populated sections are the
# same populated sections; what changes is how much unfilled structure surrounds
# them.
#
# All three documents in this library bind the same named values from
# library/values/values.yaml, re-derived against the committed ARDs at build time,
# so none of them can quote a quantity the others contradict.
# ------------------------------------------------------------------------------
template: e3-abbreviated

study:
  id: CDISCPILOT01
  title: >-
    Safety and Efficacy of the Xanomeline Transdermal Therapeutic System (TTS) in
    Patients with Mild to Moderate Alzheimer's Disease
  short_title: "Xanomeline TTS in Mild to Moderate Alzheimer's Disease"
  phase: "Phase 2"
  indication: "Mild to moderate Alzheimer's disease"
  product: "Xanomeline Transdermal Therapeutic System (TTS)"
  sponsor: "open.csr demonstration report (CDISC pilot study data)"
  cutoff: "2014-07-01"
  design: "Randomised, double-blind, placebo-controlled, parallel-group"
  treatment_groups: ["Placebo", "Xanomeline Low Dose", "Xanomeline High Dose"]
  primary_analysis_set: "Safety Analysis Set"
  data_source: "pharmaverseadam (CDISCPILOT01 ADaM)"
  scope_note: >-
    The abbreviated form of the clinical study report for this study: the same
    prose and the same displays, in a document model with the efficacy-analysis
    apparatus and the uncited appendices removed. Section 14.2 is declared and
    empty because no efficacy analysis dataset exists for this study in the
    demonstration data (design decision D12).

# Unchanged from the full report: E3 reserves 16.1.9 for the documentation of
# statistical methods, and this model retains it.
provenance_section: "16.1.9"

# ---------------------------------------------------------------------- narrative
# Identical to library/templates/ich-e3/assembly.yaml. If a block is added to the
# report, adding it here is a one-line diff; if the two ever need to diverge, the
# divergence will be visible as a diff between two files that are otherwise the
# same.
slots:
  - section: "5.2"
    text: [TXT-E3-0502]

  - section: "5.3"
    text: [TXT-E3-0503]

  - section: "9.1"
    text: [TXT-E3-0901]

  - section: "9.8"
    text: [TXT-E3-0908]

  - section: "10.1"
    text: [TXT-E3-1001, TXT-E3-1002]
    displays: [t-disposition]

  - section: "11.1"
    text: [TXT-E3-1101]

  - section: "11.2"
    text: [TXT-E3-1102]
    displays: [t-demographics]

  - section: "12.1"
    text: [TXT-E3-1201]
    displays: [t-exposure]

  - section: "12.2.1"
    text: [TXT-E3-1221]
    displays: [t-ae-overview]

  - section: "12.2.2"
    text: [TXT-E3-1222]
    displays: [t-ae-common]

  - section: "12.2.4"
    text: [TXT-E3-1224]

  - section: "12.3.1"
    text: [TXT-E3-1231]
    displays: [l-ae-serious]

  - section: "12.6"
    text: [TXT-E3-1206]

  - section: "13"
    text: [TXT-E3-1300]

# ---------------------------------------------------------------------- post-text
# Identical to the full report's, so the abbreviated report and the full report
# agree display by display: Table 14.1.1 is Table 14.1.1 in both.
post_text:
  - section: "14.1"
    displays: [t-disposition, t-demographics]

  - section: "14.3.1"
    displays: [t-exposure, t-ae-overview, t-ae-common]

  - section: "14.3.2"
    displays: [l-ae-serious]
