# ------------------------------------------------------------------------------
# t-weight — Summary of Weight and Weight Change from Baseline at End of Treatment
# ------------------------------------------------------------------------------
# Target: Table 14-7.03 of the CDISCPILOT01 clinical study report (27 June 2006).
#
# Two definitions this display owns rather than inherits, both stated in
# display.yaml's footnotes so a reader of the table sees them:
#
#   * `group: [TRT01P]` — planned treatment. The 2006 report summarises its
#     safety displays by planned treatment (N = 86 / 84 / 84); twelve subjects
#     in this study received a treatment other than the one planned. The rest of
#     the open.csr library groups by TRT01A, so this is a deliberate departure,
#     made to keep the display comparable with the document it targets.
#   * Baseline and end-of-treatment are `prepare_data()` derivations (BLVAL,
#     CHGBL, EOTFL), not the shipped BASE/CHG or the AVISIT == "End of
#     Treatment" record. See the roxygen block on `prepare_data()`.
# ------------------------------------------------------------------------------
id: t-weight
title: "Summary of Weight and Weight Change from Baseline at End of Treatment"
regulatory_id: VST03
type: table
dataset: advs
analysis_set: safety
denominator: adsl
group:
  - TRT01P
total: false
analyses:
  # Supplies the column denominators (N = subjects in the safety analysis set),
  # which is the population the display describes rather than the number of
  # subjects with a weight measurement at any one visit.
  - name: population
    method: subject_count
    label: "Subjects in the safety analysis set"
    variable: POPFL

  - name: wt_bl
    method: continuous
    label: "Weight at baseline (kg)"
    variables: [AVAL]
    filter: 'PARAMCD == "WEIGHT" & AVISIT == "Baseline" & is.na(DTYPE) & !is.na(AVAL)'
  - name: wt_wk24
    method: continuous
    label: "Weight at Week 24 (kg)"
    variables: [AVAL]
    filter: 'PARAMCD == "WEIGHT" & AVISIT == "Week 24" & is.na(DTYPE) & !is.na(AVAL)'
  - name: wt_eot
    method: continuous
    label: "Weight at end of treatment (kg)"
    variables: [AVAL]
    filter: 'PARAMCD == "WEIGHT" & EOTFL == "Y" & !is.na(AVAL)'

  - name: chg_wk24
    method: continuous
    label: "Weight change from baseline at Week 24 (kg)"
    variables: [CHGBL]
    filter: 'PARAMCD == "WEIGHT" & AVISIT == "Week 24" & is.na(DTYPE) & !is.na(CHGBL)'
  - name: chg_eot
    method: continuous
    label: "Weight change from baseline at end of treatment (kg)"
    variables: [CHGBL]
    filter: 'PARAMCD == "WEIGHT" & EOTFL == "Y" & !is.na(CHGBL)'
